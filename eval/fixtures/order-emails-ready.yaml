    src/emails_test.go: |
      package shop

      import (
          "errors"
          "testing"
      )

      func TestOrderPlaced(t *testing.T) {
          want := errors.New("delivery failed")
          calls := 0
          err := OrderPlaced("order-42", func(id string) error {
              calls++
              if id != "order-42" { t.Errorf("order ID = %q", id) }
              return want
          })
          if calls != 1 || err != want { t.Fatalf("calls = %d, error = %v", calls, err) }
      }
