# Two projects: web (where the agent starts) and api.
primary: web
projects:
  api:
    issues:
      - alias: auth
        title: Auth endpoint
        state: ready
        body: Issue login tokens.
        context: Add the token endpoint.
        criteria: [Tokens are issued]
    knowledge:
      - path: /components/auth.md
        type: component
        title: Auth
        description: How login tokens work.
        body: "Access tokens expire after 15 minutes; refresh tokens after 30 days."
  web:
    issues:
      - alias: login
        title: Login page
        state: ready
        body: A login page that uses the api's auth endpoint.
        context: Call the api token endpoint from the login form.
        criteria: [A user can log in]
      - alias: home
        title: Home page
        body: The landing page.
