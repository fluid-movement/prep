name: natural-fix-opt-out
description: Explicit tracking opt-out permits implementation without creating records.
prompt: formatPrice shows 5.5 instead of 5.50. fix it, but do not create or update prep issues or knowledge for this diagnostic; report any needed follow-up instead.
fixture: webapp
limits: {max_turns: 25}
expect:
  tools:
    - no_prep_files: true
    - not_ran: {command: new}
  outcome:
    - repo: {changed: ['src/lib/format.ts']}
    - unchanged: {all: true, knowledge: true}
    - created: {issues: {max: 0}}
