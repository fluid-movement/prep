name: natural-fix-matching-issue
description: A bug fix asked for in plain words, with a tracked issue for it. The skill's promise is that tracked work is claimed, logged and left with its knowledge in step.
tags: [plugin-ab]
prompt: the headline on the player page gets cut off after 80 characters, i think the database column is too small. fix it.
fixture: webapp
limits: {max_turns: 40}
expect:
  tools:
    - no_prep_files: true
    - any_of: [{command: claim}, {command: log}, {command: complete}]
  outcome:
    - repo: {changed: ['db/schema.sql']}
    - issue: {ref: '{{headline}}', state: 'in-progress|done'}
    - check: {warnings: 0}
  rubric:
    - The knowledge entry about profile fields no longer says the headline is stored as VARCHAR(80) and cut to 80 characters; it was updated or the change is recorded in it.
