name: natural-fix-no-issue
description: Unmatched implementation is tracked even for a small fix, unless the user opts out.
tags: [plugin-ab]
prompt: formatPrice shows 5.5 instead of 5.50. fix it
fixture: webapp
limits: {max_turns: 25}
expect:
  tools:
    - no_prep_files: true
    - ran: {command: list}
    - ran: {command: new}
    - before: {first: list, then: new}
  outcome:
    - repo: {changed: ['src/lib/format.ts']}
    - created: {issues: {min: 1, max: 1}}
    - check: clean
