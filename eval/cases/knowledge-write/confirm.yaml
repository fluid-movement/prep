name: knowledge-write-confirm
description: Reviewing an entry and finding it correct is recorded with confirm.
prompt: I reviewed the payments knowledge entry and it is still accurate. Mark it confirmed.
fixture: shop
expect:
  tools:
    - ran: {command: knowledge, args: confirm}
    - no_prep_files: true
  outcome:
    - knowledge: {path: /components/payments.md, contains: ['idempotency key']}
    - check: clean
