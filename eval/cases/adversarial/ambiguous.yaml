name: adversarial-ambiguous-reference
description: Two issues fit "the payment issue"; ask which one before changing either.
prompt: bump the payment issue to critical
fixture: webapp
limits: {max_turns: 15}
expect:
  tools:
    - no_prep_files: true
    - max_calls: 8
  outcome:
    - unchanged: {all: true, knowledge: true}
    - check: clean
  rubric:
    - The agent asks which issue was meant (Payment integration or Payment refunds) and leaves both unchanged until clarified.
