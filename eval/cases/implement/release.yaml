name: implement-release
description: Stopping unfinished work releases the claim instead of leaving it.
prompt: I am stopping work on Order emails for today without finishing it. Release it and say why.
fixture: shop
expect:
  tools:
    - ran: release
    - no_prep_files: true
  outcome:
    - claimed: {ref: '{{emails}}', claimed: false}
    - issue: {ref: '{{emails}}', state: ready}
