name: real-bootstrap-survey
description: The expensive real task - build the knowledge base and file issues for a project prep was just set up in.
tags: [expensive]
prompt: prep was just initialized in this project. do a full scan of the project to build the knowledge base, and create issues from the todos and documentation. also create issues if you find bugs.
fixture: webapp-fresh
limits: {max_turns: 90, max_budget_usd: 3, timeout: 25m}
expect:
  tools:
    - no_prep_files: true
    - ran: {command: check, max: 8}
    - ran: {command: knowledge, args: new, min: 3}
  outcome:
    - knowledge: {path: /overview.md, type: overview}
    - created: {entries: {min: 3, max: 16}, issues: {min: 2, max: 15}}
    - check: clean
  rubric:
    - Every knowledge entry describes things that exist in this repository; none invents components, files or behavior.
    - The issues include the real findings in the code and docs (the search and markdown export todos, the per user token todo, the unescaped title in addNote), not generic advice.
    - The knowledge entries are scoped to the code they describe and are not repetitions of one another.
