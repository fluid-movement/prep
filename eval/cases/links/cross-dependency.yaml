name: links-cross-dependency
description: A dependency on another project's issue is written as a cross-project dependency.
tags: [smoke]
prompt: |
  File an issue "Show login errors" in this project that cannot start until the api project's
  Auth endpoint issue is done.
workspace: shop-api
expect:
  tools:
    - any_of: [{command: new, args: 'depends-on'}, {command: edit, args: 'depends-on'}]
    - no_prep_files: true
  outcome:
    - issue: {title: login errors, depends_on: ['{{api/auth}}']}
    - check: clean
