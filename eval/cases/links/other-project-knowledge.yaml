name: links-other-project-knowledge
description: Knowledge of a linked project is read through prep knowledge --project.
prompt: How long do access tokens last according to the api project's documentation?
workspace: shop-api
expect:
  tools:
    - ran: {command: knowledge, project: api}
    - no_prep_files: true
    - final_mentions: 15 minutes
  outcome:
    - unchanged: {all: true, knowledge: true, project: api}
