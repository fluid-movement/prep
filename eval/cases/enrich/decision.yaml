name: enrich-record-decision
description: A decision is recorded as a decision, with its rationale.
prompt: |
  On the Payment integration issue, record a decision: we will send an idempotency key with every charge,
  because retried requests would otherwise charge a customer twice.
fixture: shop
expect:
  tools:
    - ran: {command: decide, args: '(?i)idempot'}
    - no_prep_files: true
  outcome:
    - issue: {ref: '{{pay}}', state: ready}
    - check: clean
