name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # knowledge drift compares against confirmed commits
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: build for every release target
        run: for os in linux darwin windows; do GOOS=$os go build -o /dev/null ./cmd/prep; done
      - run: go build -o prep ./cmd/prep
      - name: prep check
        run: ./prep check
      - name: prep fmt --check
        run: ./prep fmt --check
