name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # knowledge drift compares against confirmed commits
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o prep ./cmd/prep
      - name: prep check
        run: ./prep check
      - name: prep fmt --check
        run: ./prep fmt --check

  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o prep ./cmd/prep
      - name: swift test
        working-directory: desktop
        run: PREP_BIN="$GITHUB_WORKSPACE/prep" swift test
      - name: swift build (release)
        working-directory: desktop
        run: swift build -c release --product PrepDesktop
