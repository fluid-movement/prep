name: eval

# Agent behavior tests (prep eval). They call the Claude API, so they run only
# where the credential exists: on pull requests from this repository that touch
# the plugin, the skill or the suite (the cheap smoke subset), weekly (every
# case on two models), and on demand.
#
# Setup: run `claude setup-token` once and store the token as the repository
# secret CLAUDE_CODE_OAUTH_TOKEN (or store ANTHROPIC_API_KEY instead).

on:
  pull_request:
    paths:
      - "plugins/claude-code/**"
      - "internal/cli/skill.md"
      - "eval/**"
      - "internal/eval/**"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      models:
        description: "Models to run, comma-separated"
        default: "haiku,sonnet"
      n:
        description: "Runs per cell"
        default: "5"
      max_usd:
        description: "Stop when this much has been spent"
        default: "40"

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  smoke:
    # Pull requests from forks have no secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: go build -o prep ./cmd/prep
      - name: isolation check
        run: ./prep eval doctor --model haiku
      - name: smoke subset
        run: ./prep eval run --smoke --models haiku --n 3 --max-usd 5 --yes
      - name: compare with the committed baseline
        run: |
          if [ -f eval/baseline.json ]; then ./prep eval check latest; else echo "no eval/baseline.json yet; create it with prep eval check latest --update"; fi
      - name: report
        if: always()
        run: ./prep eval report latest --failures >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-smoke
          path: eval/results
          retention-days: 14

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: go build -o prep ./cmd/prep
      - name: isolation check
        run: ./prep eval doctor --model haiku
      - name: every case
        run: ./prep eval run --models "${{ inputs.models || 'haiku,sonnet' }}" --n "${{ inputs.n || '5' }}" --max-usd "${{ inputs.max_usd || '40' }}" --yes
      - name: report
        if: always()
        run: |
          ./prep eval report latest --failures >> "$GITHUB_STEP_SUMMARY"
          ./prep eval models latest --md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-full
          path: eval/results
          retention-days: 30
