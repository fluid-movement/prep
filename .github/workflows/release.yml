name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Plugin version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in plugins/claude-code/.claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            got=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$f" | head -1)
            if [ "$got" != "$want" ]; then
              echo "$f has version $got, the tag is $GITHUB_REF_NAME; prepare releases with just release" >&2
              exit 1
            fi
          done
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
